[project]
name = "codeplane"
version = "0.1.0"
description = "The control plane for AI coding agents"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "python-multipart>=0.0.26,<1",
    # Database
    "sqlalchemy>=2.0,<3",
    "aiosqlite>=0.20,<1",
    "alembic>=1.14,<2",
    # Agent SDK
    "github-copilot-sdk>=0.3.0,<0.4",
    # Structured logging
    "structlog>=24.0,<26",
    # Terminal UI
    "rich>=13.0,<15",
    # Config
    "pyyaml>=6.0,<7",
    # Pydantic (used by FastAPI)
    "pydantic>=2.0,<3",
    # CLI
    "click>=8.0,<9",
    "questionary>=2.0,<3",
    # MCP server
    "mcp>=1.9,<2",
    # Windows ConPTY terminal backend (POSIX uses the stdlib pty module)
    "pywinpty>=2.0 ; sys_platform == 'win32'",
    "claude-code-sdk>=0.0.25,<0.1",
    "httpx>=0.28,<1",
    "dishka[fastapi]>=1.9.1,<2",
    "pyjwt[crypto]>=2.12.0,<3",
    "cryptography>=46.0,<47",
    # Structural analysis (full SDK — SPLADE/CE disabled by default via config)
    "coderecon-ai @ git+https://github.com/dfinson/coderecon.git@main",
    "cloudflare>=5.1.0",
    "sh-guard>=0.1.10",
    # Agent-trace intelligence substrate — deterministic/CPU-only pipeline that
    # CodePlane's hand-rolled ingestion/classification/structuring/governance/
    # observability plumbing is being migrated onto (see P0–P7 migration roadmap).
    # PyPI is the primary distribution (code-only wheel); it pulls the real
    # traceforge-title-model ONNX weights transitively. A git+ install is avoided
    # on purpose — it force-checks-out the LFS monorepo and trips a missing LFS
    # object on the remote (tracked as an upstream defect).
    "traceforge-toolkit>=0.1.5,<0.2",
    "psutil>=7.2.2",
]

[project.optional-dependencies]
voice = ["faster-whisper>=1.1,<2"]
push = ["pywebpush>=2.3.0", "py-vapid>=1.9.4", "qrcode>=7.0,<9"]
telemetry = ["opentelemetry-api>=1.20,<2", "opentelemetry-sdk>=1.20,<2"]
tokenizer = ["tiktoken>=0.12.0,<1", "anthropic-tokenizer>=0.1.0,<1"]
all = [
    "codeplane[voice]",
    "codeplane[push]",
    "codeplane[telemetry]",
    "codeplane[tokenizer]",
]

[project.scripts]
cpl = "backend.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# The coderecon-ai model sub-packages contain large binary model files that
# require Git LFS and fail to build in CI. They are only needed at runtime for
# ML inference, not for building/testing codeplane. Redirect them to local stubs.
override-dependencies = [
    "coderecon-ai-models-ce",
    "coderecon-ai-models-ce-tiny",
    "coderecon-ai-models-splade",
]

[tool.uv.sources]
coderecon-ai-models-ce = { path = "stubs/coderecon-models-ce" }
coderecon-ai-models-ce-tiny = { path = "stubs/coderecon-models-ce-tiny" }
coderecon-ai-models-splade = { path = "stubs/coderecon-models-splade" }


[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
artifacts = ["backend/web/**"]

[tool.hatch.build.hooks.custom]
path = "tools/hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
]

[tool.ruff.lint.flake8-type-checking]
# dishka resolves FromDishka[T] annotations at runtime via get_type_hints(),
# so types referenced in route handler signatures must be importable at runtime.
runtime-evaluated-decorators = ["dishka.integrations.fastapi.FromDishka"]

[tool.ruff.lint.per-file-ignores]
# Route handlers use dishka FromDishka[T] annotations that are resolved at
# runtime — imports for these types must stay outside TYPE_CHECKING blocks.
"backend/api/*.py" = ["TC001", "TC002"]
"backend/di.py" = ["TC001", "TC002", "TC003"]
# api_schemas re-exports via star imports intentionally for backward compat.
"backend/models/api_schemas.py" = ["F405"]
# Template service contains long LLM prompt strings that cannot be wrapped.
"backend/services/sidecar/template_service.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["faster_whisper.*", "copilot.*", "mcp.*", "qrcode.*", "questionary.*", "winpty.*", "coderecon.*", "psutil"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["backend.mcp.server"]
disable_error_code = ["misc"]

[[tool.mypy.overrides]]
module = ["backend.tests.*"]
strict = false
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disable_error_code = ["arg-type", "no-untyped-def", "no-untyped-call", "attr-defined", "typeddict-item", "typeddict-unknown-key", "union-attr", "operator", "method-assign", "index", "assignment", "type-arg", "type-var", "override", "misc", "comparison-overlap", "unused-ignore"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
timeout = 60
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
    "ignore::pytest.PytestUnhandledThreadExceptionWarning",
    "ignore:coroutine .* was never awaited:RuntimeWarning",
]

[tool.coverage.run]
source = ["backend"]
omit = [
    "backend/tests/*",
    "backend/tests/**/*",
]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_empty = true

[dependency-groups]
dev = [
    "codeplane[all]",
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=6.0,<7",
    "types-PyYAML",
    "mypy>=1.13,<2",
    "ruff>=0.8,<1",
    "pre-commit>=4.0,<5",
    "pip-audit>=2.10.0",
    "pytest-timeout>=2.4.0",
    "types-psutil",
]
