# CodePlane classification overlay for TraceForge (ruling U4).
#
# Loaded explicitly by backend/services/action_policy/tf_classify_adapter.py via
# `load_config(this_path, merge_defaults=True)` and wrapped in a ClassificationEngine.
# Merges ON TOP of TraceForge's built-in classify data (canonical_tools.yaml etc.):
# dict fields extend/override per-key, so these entries only ADD CodePlane-specific
# tool names that upstream TraceForge does not yet alias.
#
# Purpose: teach the trained classifier CodePlane's SDK tool-name vocabulary so
# classify_tool() returns the correct mechanism/effect/capability. Without these,
# names like `insert_edit_into_file`, `semantic_search`, `memory`, and
# `fetch_webpage` fall through to the `unknown` mechanism (and would be
# conservatively gated / mis-contained by the adapter).
#
# No TraceForge core change — pure config overlay.

canonical_tools:
  # ── File edit (existing) → canonical "edit" ──
  replace_string_in_file: edit
  multi_replace_string_in_file: edit
  insert_edit_into_file: edit
  str_replace_based_edit_tool: edit

  # ── File read → canonical "view" ──
  view_image: view
  readFile: view
  open_file: view
  get_file_contents: view
  listDir: view

  # ── Semantic / code search → canonical "codebase_search" ──
  semantic_search: codebase_search
  codeSearch: codebase_search
  vscode_listCodeUsages: codebase_search

  # ── Filename/pattern search → canonical "glob" ──
  file_search: glob

  # ── Shell execution → canonical "shell" (dialect detected from command) ──
  run_terminal: shell
  run_in_terminal: shell

  # ── Agent bookkeeping (internal state writes, inert) → canonical "state_write" ──
  manage_todo_list: state_write
  memory: state_write
  store_memory: state_write

  # ── Agent delegation → canonical "task" ──
  runSubagent: task

  # ── Web fetch → canonical "web_fetch" (network.http, uncontained) ──
  fetch_webpage: web_fetch
