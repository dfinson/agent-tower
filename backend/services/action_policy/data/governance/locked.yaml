# Governance recommendation rules — LOCKED preset (most restrictive).
#
# Posture (SPEC §18.3): near-nothing proceeds silently. Every mutation reaches a
# human (ESCALATE); even read-only shell commands leave a WARN; only pure
# read-only non-shell work (file/tool reads) auto-allows. First match wins.
recommendation_rules:
  # ── Critical: deny outright ──
  - id: piped_network_exec
    when:
      structure: [piped]
      capability: [network_outbound]
    recommend: deny
    reason: piped_network_exec

  - id: risk_critical
    when:
      risk_score: ">=80"
    recommend: deny
    reason: risk_score_critical

  # ── Dangerous / all mutations: escalate to a human ──
  - id: raw_device_write
    when:
      capability: [raw_device_write]
    recommend: escalate
    reason: raw_block_device_write

  - id: filesystem_format
    when:
      capability: [filesystem_format]
    recommend: escalate
    reason: filesystem_format

  - id: persistence_write
    when:
      capability: [persistence_write]
    recommend: escalate
    reason: persistence_mechanism_write

  - id: fork_bomb
    when:
      capability: [fork_bomb]
    recommend: escalate
    reason: fork_bomb_pattern

  - id: credential_exposure
    when:
      capability: [credential_exposure]
    recommend: escalate
    reason: credential_exposure

  - id: destructive_action
    when:
      effect: destructive
    recommend: escalate
    reason: destructive_action

  - id: mutating_locked              # ANY mutation → human in locked mode
    when:
      effect: mutating
    recommend: escalate
    reason: mutating_locked

  - id: risk_danger
    when:
      risk_score: ">=35"
    recommend: escalate
    reason: risk_score_danger

  # ── Caution: read-only shell still leaves a savepoint ──
  - id: readonly_shell_locked
    when:
      effect: read_only
      mechanism: process.shell
    recommend: warn
    reason: readonly_shell_locked

  - id: risk_caution
    when:
      risk_score: ">=15"
    recommend: warn
    reason: risk_score_caution
  # Pure read-only non-shell (file/tool reads) → no match → ALLOW.
