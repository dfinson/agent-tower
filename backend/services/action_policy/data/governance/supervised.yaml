# Governance recommendation rules — SUPERVISED preset (default, balanced).
#
# Posture (SPEC §18.3): reversible/contained mutations proceed but leave a git
# savepoint (WARN) and notify; anything destructive, network-egressing, or
# elevated-risk reaches a human (ESCALATE); reads auto-allow. First match wins.
recommendation_rules:
  # ── Critical: deny outright ──
  - id: piped_network_exec
    when:
      structure: [piped]
      capability: [network_outbound]
    recommend: deny
    reason: piped_network_exec

  - id: risk_critical
    when:
      risk_score: ">=85"
    recommend: deny
    reason: risk_score_critical

  # ── Dangerous: escalate to a human ──
  - id: raw_device_write
    when:
      capability: [raw_device_write]
    recommend: escalate
    reason: raw_block_device_write

  - id: filesystem_format
    when:
      capability: [filesystem_format]
    recommend: escalate
    reason: filesystem_format

  - id: persistence_write
    when:
      capability: [persistence_write]
    recommend: escalate
    reason: persistence_mechanism_write

  - id: fork_bomb
    when:
      capability: [fork_bomb]
    recommend: escalate
    reason: fork_bomb_pattern

  - id: credential_exposure
    when:
      capability: [credential_exposure]
    recommend: escalate
    reason: credential_exposure

  - id: destructive_action
    when:
      effect: destructive
    recommend: escalate
    reason: destructive_action

  - id: mutating_network
    when:
      effect: mutating
      capability: [network_outbound]
    recommend: escalate
    reason: mutating_with_network

  - id: risk_danger
    when:
      risk_score: ">=65"
    recommend: escalate
    reason: risk_score_danger

  # ── Caution: savepoint + notify ──
  - id: mutating_savepoint           # edits / contained writes → WARN (git savepoint)
    when:
      effect: mutating
    recommend: warn
    reason: mutating_savepoint

  - id: risk_caution
    when:
      risk_score: ">=40"
    recommend: warn
    reason: risk_score_caution
  # Reads → no match → ALLOW.
