# Governance recommendation rules — AUTONOMOUS preset (permissive).
#
# Posture (SPEC §18.3): the agent auto-proceeds on contained/reversible work;
# only genuinely dangerous shapes reach a human. Predicates key on the enriched
# classification dims TraceForge actually emits (effect / mechanism / capability /
# structure / risk_score). A no-match result is an implicit ALLOW, so contained
# mutating work (edits, `git add`, `touch`) auto-allows. First match wins.
recommendation_rules:
  # ── Critical: deny outright ──
  - id: piped_network_exec           # curl … | sh style download-execute
    when:
      structure: [piped]
      capability: [network_outbound]
    recommend: deny
    reason: piped_network_exec

  - id: risk_critical
    when:
      risk_score: ">=85"
    recommend: deny
    reason: risk_score_critical

  # ── Dangerous: escalate to a human ──
  - id: raw_device_write
    when:
      capability: [raw_device_write]
    recommend: escalate
    reason: raw_block_device_write

  - id: filesystem_format
    when:
      capability: [filesystem_format]
    recommend: escalate
    reason: filesystem_format

  - id: persistence_write
    when:
      capability: [persistence_write]
    recommend: escalate
    reason: persistence_mechanism_write

  - id: fork_bomb
    when:
      capability: [fork_bomb]
    recommend: escalate
    reason: fork_bomb_pattern

  - id: credential_exposure
    when:
      capability: [credential_exposure]
    recommend: escalate
    reason: credential_exposure

  - id: destructive_action           # rm -rf, drop, truncate — reach a human
    when:
      effect: destructive
    recommend: escalate
    reason: destructive_action

  - id: mutating_network             # push / publish / install — not contained
    when:
      effect: mutating
      capability: [network_outbound]
    recommend: escalate
    reason: mutating_with_network

  - id: risk_danger
    when:
      risk_score: ">=70"
    recommend: escalate
    reason: risk_score_danger
  # Contained mutating work + reads → no match → ALLOW.
