name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build & Publish
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Configure coderecon git auth
        env:
          CODERECON_TOKEN: ${{ secrets.CODERECON_TOKEN }}
        run: |
          if [ -z "${CODERECON_TOKEN}" ]; then
            echo "::error::CODERECON_TOKEN secret is required"
            exit 1
          fi
          git config --global url."https://x-access-token:${CODERECON_TOKEN}@github.com/dfinson/coderecon.git".insteadOf "https://github.com/dfinson/coderecon.git"

      - name: Install backend dependencies
        run: uv sync

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Verify frontend assets
        run: test -f backend/web/index.html

      - name: Build Python package
        run: uv build

      - name: Verify frontend in wheel
        run: python -m zipfile -l dist/*.whl | grep 'backend/web/index.html'

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
